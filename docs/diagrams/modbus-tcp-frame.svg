<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="Arial, Helvetica, sans-serif"><rect width="1080" height="560" fill="#0f172a"/>
<text x="540" y="56" text-anchor="middle" font-size="32" font-weight="bold" fill="#fff">Modbus TCP: read 2 holding registers</text>
<text x="108" y="136" font-size="20" font-weight="bold" fill="#cbd5e1">Request (12 bytes)</text>
<rect x="108" y="150" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="178.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 01</text>
<text x="178.0" y="210" text-anchor="middle" font-size="14" fill="#38bdf8">trans. ID</text>
<rect x="252" y="150" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="322.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 00</text>
<text x="322.0" y="210" text-anchor="middle" font-size="14" fill="#38bdf8">protocol</text>
<rect x="396" y="150" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="466.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 06</text>
<text x="466.0" y="210" text-anchor="middle" font-size="14" fill="#38bdf8">length</text>
<rect x="540" y="150" width="68" height="74" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="574.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">01</text>
<text x="574.0" y="210" text-anchor="middle" font-size="14" fill="#a78bfa">unit</text>
<rect x="612" y="150" width="68" height="74" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="646.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">03</text>
<text x="646.0" y="210" text-anchor="middle" font-size="14" fill="#34d399">FC</text>
<rect x="684" y="150" width="140" height="74" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
<text x="754.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 00</text>
<text x="754.0" y="210" text-anchor="middle" font-size="14" fill="#fbbf24">address</text>
<rect x="828" y="150" width="140" height="74" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
<text x="898.0" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 02</text>
<text x="898.0" y="210" text-anchor="middle" font-size="14" fill="#fbbf24">quantity</text>
<text x="72" y="316" font-size="20" font-weight="bold" fill="#cbd5e1">Response (13 bytes)</text>
<rect x="72" y="330" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="142.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 01</text>
<text x="142.0" y="390" text-anchor="middle" font-size="14" fill="#38bdf8">trans. ID</text>
<rect x="216" y="330" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="286.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 00</text>
<text x="286.0" y="390" text-anchor="middle" font-size="14" fill="#38bdf8">protocol</text>
<rect x="360" y="330" width="140" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="430.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 07</text>
<text x="430.0" y="390" text-anchor="middle" font-size="14" fill="#38bdf8">length</text>
<rect x="504" y="330" width="68" height="74" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="538.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">01</text>
<text x="538.0" y="390" text-anchor="middle" font-size="14" fill="#a78bfa">unit</text>
<rect x="576" y="330" width="68" height="74" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="610.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">03</text>
<text x="610.0" y="390" text-anchor="middle" font-size="14" fill="#34d399">FC</text>
<rect x="648" y="330" width="68" height="74" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="3"/>
<text x="682.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">04</text>
<text x="682.0" y="390" text-anchor="middle" font-size="14" fill="#fb923c">count</text>
<rect x="720" y="330" width="140" height="74" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
<text x="790.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">41 BC</text>
<text x="790.0" y="390" text-anchor="middle" font-size="14" fill="#f472b6">register 0</text>
<rect x="864" y="330" width="140" height="74" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
<text x="934.0" y="364" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">00 00</text>
<text x="934.0" y="390" text-anchor="middle" font-size="14" fill="#f472b6">register 1</text>
<path d="M108,242 L108,252 L608,252 L608,242" fill="none" stroke="#475569" stroke-width="2"/>
<text x="360.0" y="276" text-anchor="middle" font-size="16" fill="#94a3b8">MBAP header (7 bytes)</text>
<path d="M612,242 L612,252 L968,252 L968,242" fill="none" stroke="#475569" stroke-width="2"/>
<text x="792.0" y="276" text-anchor="middle" font-size="16" fill="#94a3b8">PDU (5 bytes)</text>
<text x="540" y="470" text-anchor="middle" font-size="19" fill="#cbd5e1">The length field counts the unit ID and everything after it. There is no checksum, TCP provides one.</text>
<text x="540" y="505" text-anchor="middle" font-size="19" fill="#cbd5e1">An error reply sets the top bit of the function code (0x83) and sends one exception code.</text></svg>